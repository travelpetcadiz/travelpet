# Vhost de TravelPet para el nginx del servidor.
# Instalar (con sudo) cuando el dominio ya apunte a 38.242.139.250:
#   sudo cp docker/nginx-travelpet.conf /etc/nginx/sites-available/travelpetcadiz.es
#   sudo ln -s /etc/nginx/sites-available/travelpetcadiz.es /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d travelpetcadiz.es -d www.travelpetcadiz.es
# Certbot añade solo el bloque de HTTPS y la redirección desde HTTP.

server {
    listen 80;
    server_name travelpetcadiz.es www.travelpetcadiz.es;

    client_max_body_size 25M;

    # El mapa PMTiles se pide por rangos de bytes; nginx los pasa tal cual
    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
