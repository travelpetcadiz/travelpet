<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Guía gratuita de sitios pet-friendly en la provincia de Cádiz: alojamientos, restaurantes, playas, parques y servicios que admiten perros.">
<meta name="theme-color" content="#0E7F8A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<title>TravelPet Cádiz · Guía pet-friendly</title>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout "Costa de la Luz": inicio de bienvenida, mapa/lista a pantalla completa, pestañas abajo, ficha como hoja inferior.
   Turquesa atlántico para la marca, cal blanca de fondo, albero para la acción principal, verde sello para lo verificado. */
:root{
  --bg:#F6F9F9; --surface:#FFFFFF; --ink:#132A2E; --muted:#56696D; --line:#DCE5E6;
  --pine:#0E7F8A; --pine-ink:#FFFFFF; --pine-soft:#E1F3F4; --sea:#D3EBEE; --land:#EEF1EC; --land-line:#A9C3C2;
  --albero:#EBAA3C; --albero-ink:#1D1606; --albero-soft:#FCF0D9;
  --ok:#2C7A4B; --ok-bg:#E2F2E8; --warn:#8A5A00; --warn-bg:#FCEFD6; --bad:#B3261E; --bad-bg:#FBE6E3; --chip:#EEF3F3;
  --c-aloj:#2F6F8F; --c-rest:#C0582F; --c-playa:#1F8A8A; --c-esp:#5B8C2A; --c-salud:#B3261E; --c-serv:#7B5AA6; --c-trans:#6B6B3A;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px; --shadow:0 10px 30px rgba(20,35,30,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1A1C; --surface:#162427; --ink:#E5EFEF; --muted:#9BB0B2; --line:#28393C;
  --pine:#5CC6CF; --pine-ink:#062023; --pine-soft:#173538; --sea:#12282C; --land:#1C2B2D; --land-line:#3E5C5E;
  --albero:#F0B652; --albero-ink:#1D1606; --albero-soft:#3A2E16;
  --ok:#7FD39F; --ok-bg:#1C3326; --warn:#F2B860; --warn-bg:#3A2C14; --bad:#FF8A80; --bad-bg:#3A1F1C; --chip:#1E3033;
  --c-aloj:#79B6D6; --c-rest:#F0936C; --c-playa:#5FD0CF; --c-esp:#A3CF6A; --c-salud:#FF8A80; --c-serv:#B9A0E0; --c-trans:#C9C98A;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1A1C; --surface:#162427; --ink:#E5EFEF; --muted:#9BB0B2; --line:#28393C;
  --pine:#5CC6CF; --pine-ink:#062023; --pine-soft:#173538; --sea:#12282C; --land:#1C2B2D; --land-line:#3E5C5E;
  --albero:#F0B652; --albero-ink:#1D1606; --albero-soft:#3A2E16;
  --ok:#7FD39F; --ok-bg:#1C3326; --warn:#F2B860; --warn-bg:#3A2C14; --bad:#FF8A80; --bad-bg:#3A1F1C; --chip:#1E3033;
  --c-aloj:#79B6D6; --c-rest:#F0936C; --c-playa:#5FD0CF; --c-esp:#A3CF6A; --c-salud:#FF8A80; --c-serv:#B9A0E0; --c-trans:#C9C98A;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabecera */
header{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px 8px;display:grid;gap:8px;position:relative;z-index:5;grid-template-columns:minmax(0,1fr)}
header > *{min-width:0}
.top{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;color:var(--pine);display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.brand small{font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--muted);letter-spacing:0}
.top .sp{flex:1}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.92rem;cursor:pointer;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.seg .n{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:999px;background:var(--pine);color:var(--pine-ink);font-size:.72rem;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.seg .n[hidden]{display:none}
.seg button[aria-pressed="true"] .n{background:var(--pine-ink);color:var(--pine)}
@media (max-width:420px){ .brand small{display:none} .brand{font-size:1.2rem;gap:4px} .brand svg{width:22px;height:22px} .top{gap:6px} .seg button{padding:6px 8px;font-size:.86rem} }
@media (max-width:340px){ .brand{font-size:1.05rem} .seg button{padding:6px 6px;font-size:.8rem} }
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 12px;font-size:1rem;min-height:44px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;font-weight:700;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);font-size:.95rem}
.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn.ghost{background:none}
.btn .n{background:var(--pine);color:var(--pine-ink);border-radius:999px;font-size:.75rem;padding:1px 7px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:38px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.active-f{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;color:var(--muted);align-items:center}
.active-f button{border:0;background:var(--sea);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.82rem}

/* Cuerpo */
main{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
#list{position:absolute;inset:0;overflow-y:auto;padding-block:12px 120px}
.count{font-size:.9rem;color:var(--muted);margin:0 0 10px;font-variant-numeric:tabular-nums}
.items{display:grid;gap:10px;max-width:760px;margin:0 auto}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--muted)}
.item h3{margin:0;font-family:var(--display);font-weight:600;font-size:1.08rem;line-height:1.25;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.86rem;color:var(--muted);align-items:center}
.meta .cat{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--ink)}
.stamp{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.stamp.ok{background:var(--ok-bg);color:var(--ok)}
.stamp.warn{background:var(--warn-bg);color:var(--warn)}
.stamp.no{background:var(--warn-bg);color:var(--bad)}
.stamp.of{background:var(--sea);color:var(--ink)}
.alert.soft{background:var(--sea);color:var(--ink);font-weight:400}
.muni-h{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.empty{max-width:520px;margin:40px auto;text-align:center;color:var(--muted)}

/* Mi viaje */
#trip{position:absolute;inset:0;overflow-y:auto;padding-block:12px 120px}
.trip-in{max-width:760px;margin:0 auto}
.trip-in > h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:4px 0 2px;letter-spacing:-.01em}
.trip-h{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px}
.trip-h h3{font-family:var(--display);font-weight:800;font-size:1.1rem;margin:0}
.trip-h span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.trow .tact{display:flex;flex-direction:column;gap:6px;justify-content:center}
.mini{min-height:36px;padding:5px 10px;font-size:.85rem}
.stamp.trip{background:var(--pine);color:var(--pine-ink)}
.mine{display:flex;flex-wrap:wrap;gap:8px}
.mine .btn[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.mine-box{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.mine-box b{font-family:var(--display);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.revs{display:grid;gap:10px}
.revs-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.revs-h h3{font-family:var(--display);font-weight:800;font-size:1.1rem;margin:0}
.stars{color:#C98A00;letter-spacing:1px;font-variant-numeric:tabular-nums}
.rev{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px}
.rev p{margin:0;overflow-wrap:anywhere}
.trip-empty{border:1px dashed var(--line);border-radius:var(--r);padding:14px;color:var(--muted);font-size:.92rem}

/* Pie fijo con acciones */
.fab{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:900}
.fab .btn{box-shadow:var(--shadow)}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:2000}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:2001;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow-y:auto;box-shadow:var(--shadow);padding-block:8px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:680px;margin:0 auto;display:grid;gap:14px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 6px}
.sheet h2{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sheet .x{position:sticky;top:0;justify-self:end;width:auto;min-width:44px;margin-left:8px;z-index:1}
.trust{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;background:var(--bg)}
.trust b{font-family:var(--display);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.trust .row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-variant-numeric:tabular-nums}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 12px;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.alert svg{flex:none;width:20px;height:20px;margin-top:1px}
dl.f{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:8px 12px;margin:0}
dl.f dt{color:var(--muted);font-size:.88rem}
dl.f dd{margin:0;min-width:0;overflow-wrap:anywhere}
.nc{color:var(--muted);font-style:italic}
.src a{color:var(--pine);overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:.85rem;color:var(--muted)}
.sheet label{display:grid;gap:4px;font-size:.88rem;font-weight:700}
.sheet input,.sheet select,.sheet textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-weight:400;font-size:1rem;min-height:42px;width:100%;box-sizing:border-box}
.sheet textarea{min-height:110px}
.form{display:grid;gap:10px}
.check{display:flex!important;align-items:center;gap:10px;font-weight:700}
.check input{width:22px;height:22px;min-height:0}
.editbar{background:var(--ink);color:var(--surface);padding-block:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem}
.editbar .btn{min-height:38px;padding:6px 12px;background:transparent;color:var(--surface);border-color:rgba(255,255,255,.35)}
.editbar .btn.pri{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;z-index:3000;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px)}

/* Leaflet (estilos mínimos necesarios) */
.leaflet-pane,.leaflet-marker-icon,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;font-family:var(--body);-webkit-tap-highlight-color:transparent;outline-offset:1px}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon{display:block}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:0}
.leaflet-left .leaflet-control{margin-left:max(10px,env(safe-area-inset-left,0px))}.leaflet-right .leaflet-control{margin-right:0}
.leaflet-bar{border-radius:10px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.leaflet-bar a{display:block;width:40px;height:40px;line-height:40px;text-align:center;text-decoration:none;background:var(--surface);color:var(--ink);font-size:20px;font-weight:700}
.leaflet-bar a+a{border-top:1px solid var(--line)}
.leaflet-control-attribution{background:var(--surface);color:var(--muted);font-size:11px;padding:1px 6px;opacity:.9}
.leaflet-control-attribution a{color:var(--muted)}
@media (prefers-reduced-motion: reduce){.leaflet-zoom-anim .leaflet-zoom-animated{transition:none}}

/* Marcadores */
.bub{width:0!important;height:0!important}
.bub>div{transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto}
.bub span{display:grid;place-items:center;min-width:44px;height:44px;padding:0 8px;box-sizing:border-box;border-radius:999px;background:var(--pine);color:var(--pine-ink);font-weight:700;font-size:1rem;border:3px solid var(--surface);box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.bub em{font-style:normal;font-size:.75rem;font-weight:700;background:var(--surface);color:var(--ink);padding:1px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.bub.on span{background:var(--ink);color:var(--surface)}
.pin{width:0!important;height:0!important}
.pin>i{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:var(--shadow);box-sizing:border-box;pointer-events:auto;display:block}
.me{width:0!important;height:0!important}
.me>i{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25),0 1px 4px rgba(0,0,0,.3);box-sizing:border-box;display:block}
.locbtn{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;padding:0}
.locbtn svg{width:22px;height:22px}
.locbtn[aria-busy="true"]{opacity:.6}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:900;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.78rem;color:var(--muted);max-width:min(260px,calc(100% - 150px))}

/* ---------- Rediseño ---------- */
header .top{display:none}
header{padding-block:12px 8px}
.search input{border-radius:14px;background:var(--surface);border-width:1.5px;min-height:48px}
.chip{min-height:40px;padding:7px 14px}
.chip[aria-pressed="true"]{border-color:var(--pine);background:var(--pine);color:var(--pine-ink)}
#list,#trip{padding-block:12px 96px}
#home{position:absolute;inset:0;overflow-y:auto;background:var(--bg)}
.hero{background:var(--pine);color:var(--pine-ink);padding-top:22px;padding-bottom:44px;position:relative}
.hero .brandrow{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.3rem}
.hero .pawdot{width:30px;height:30px;border-radius:50%;background:var(--albero);color:var(--albero-ink);display:grid;place-items:center}
.hero .pawdot svg{width:18px;height:18px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,7.5vw,2.3rem);line-height:1.08;letter-spacing:-.02em;margin:20px 0 8px;text-wrap:balance}
.hero p{margin:0;opacity:.92;font-size:1.02rem;max-width:34ch}
.stats{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:7px 12px;font-size:.82rem;line-height:1.2}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.home-in{max-width:620px;margin:-26px auto 0;position:relative;display:grid;gap:12px;padding-bottom:110px}
.home-in .sheetcard{background:var(--bg);border-radius:22px 22px 0 0;padding-top:18px;display:grid;gap:12px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:16px;font-weight:700;font-size:1.05rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;width:100%;text-decoration:none}
.cta.pri,.btn.go{background:var(--albero);border-color:var(--albero);color:var(--albero-ink)}
.cta svg,.btn svg{width:20px;height:20px;flex:none}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat-t{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-weight:700;font-size:.86rem;cursor:pointer;display:grid;gap:6px;justify-items:center;min-height:84px;align-content:center;color:var(--ink)}
.cat-t i{width:30px;height:30px;border-radius:50%;display:block}
.seal-box{display:flex;gap:12px;align-items:center;border-radius:16px;padding:12px 14px;line-height:1.35;font-size:.92rem}
.seal-box.ok{background:var(--ok-bg);border:1.5px solid var(--ok)}
.seal-box.of{background:var(--pine-soft);border:1.5px solid var(--pine)}
.seal-box.un{background:var(--chip);border:1.5px solid var(--line)}
.seal-box p{margin:0}
.seal{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ok);box-shadow:inset 0 0 0 3px var(--ok),inset 0 0 0 5px rgba(255,255,255,.65)}
.seal svg{width:20px;height:20px}
.seal.of{background:var(--pine);color:var(--pine-ink);box-shadow:inset 0 0 0 3px var(--pine),inset 0 0 0 5px rgba(255,255,255,.55)}
.seal.un{background:var(--muted);color:var(--surface);box-shadow:none}
.home-links{display:flex;gap:10px;flex-wrap:wrap}
.home-links .btn{flex:1 1 140px}
.sec-h{font-family:var(--display);font-weight:800;font-size:1.05rem;margin:6px 0 -2px}

/* lista */
.item{border-radius:16px;padding:14px;gap:6px}
.it-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.km{font-size:.85rem;font-weight:700;color:var(--pine);white-space:nowrap;font-variant-numeric:tabular-nums}
.glance{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.g{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:3px 10px;border-radius:9px;font-size:.84rem;font-weight:700;background:var(--chip);color:var(--ink);max-width:100%}
.g svg{width:15px;height:15px;flex:none}
.g.no{background:var(--bad-bg);color:var(--bad)}
.g.cond{background:var(--albero-soft);color:var(--warn)}
.g.nc{background:none;padding-left:0;color:var(--muted);font-weight:400}
.trustline{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700}
.trustline svg{width:15px;height:15px}
.trustline.ok{color:var(--ok)}.trustline.of{color:var(--pine)}.trustline.un{color:var(--muted);font-weight:400}
.list-foot{margin-top:18px;display:grid;gap:10px;text-align:center}
.list-foot p{margin:0;color:var(--muted);font-size:.9rem}

/* ficha */
.fhead{background:var(--pine);color:var(--pine-ink);border-radius:18px;padding:16px;display:grid;gap:4px;margin-top:-4px}
.fhead .ftop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fhead h2{color:var(--pine-ink);font-size:1.45rem}
.fhead .x{background:rgba(255,255,255,.16);border-color:transparent;color:var(--pine-ink);position:static}
.fhead .fmeta{font-size:.9rem;opacity:.9}
.answer{display:flex;gap:12px;align-items:center}
.answer .ai{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--albero-soft);color:var(--warn)}
.answer .ai svg{width:30px;height:30px}
.answer.yes .ai{background:var(--ok-bg);color:var(--ok)}
.answer.no .ai{background:var(--bad-bg);color:var(--bad)}
.answer b{display:block;font-family:var(--display);font-size:1.3rem;line-height:1.15}
.answer span{color:var(--muted);font-size:.92rem}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.fact.w{grid-column:1/-1}
.fact small{display:block;color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.fact span{font-weight:700;font-size:.98rem;line-height:1.3;overflow-wrap:anywhere}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.duo .btn{min-height:50px;font-size:1rem;border-radius:14px}
.mine .btn{flex:1}
.mine .btn[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
details.more{border:1px solid var(--line);border-radius:14px;padding:4px 12px}
details.more summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.more dl{padding:4px 0 10px}

/* pestañas */
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);position:relative;z-index:6}
.tabbar button{flex:1;border:0;background:none;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:8px 2px 8px;min-height:60px;font-size:.76rem;font-weight:700;color:var(--muted);position:relative}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-pressed="true"]{color:var(--pine)}
.tabbar button[aria-pressed="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--pine)}
.tabbar .n{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--albero);color:var(--albero-ink);font-size:.7rem;line-height:18px;padding:0 5px;font-variant-numeric:tabular-nums}
.fab{bottom:16px}
.fab .btn{border-radius:999px;min-height:50px;padding:0 18px}
.legend{bottom:16px}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
</style>

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

function daysSince(d){ const t = Date.parse(d); return isNaN(t) ? null : Math.floor((Date.now() - t) / 864e5); }
function fmtDate(d){ const t = Date.parse(d); return isNaN(t) ? d || "sin fecha" : new Date(t).toLocaleDateString("es-ES", {day:"numeric", month:"short", year:"numeric"}); }
function verified(r){ return norm(r["Verificado"]).startsWith("si"); }
function oficial(r){ return norm(r["Fuente oficial"]).startsWith("si"); }
function needsWarning(r){ const d = daysSince(r["Fecha de comprobación"]); return !verified(r) || d === null || d > STALE_DAYS; }

function weightLimit(r){
  const t = norm(r["Tamaño o peso máximo"]);
  if (!t || t === "no consta" || t.includes("dudoso")) return null;
  if (t.includes("sin limite")) return Infinity;
  const nums = (t.match(/\d+(?:[.,]\d+)?/g) || []).map(n => parseFloat(n.replace(",", ".")));
  return nums.length ? Math.max(...nums) : null;
}
function fitsSize(r){
  if (!S.size) return true;
  const lim = weightLimit(r);
  if (lim === null) return true;
  const want = +S.size;
  return want === 40 ? lim > 25 : lim >= want;
}

function center(m){ const c = (data.config.municipios || {})[m]; return c ? [c[0], c[1]] : null; }
function coords(r){
  const la = parseFloat(String(r["Latitud"]).replace(",", ".")), lo = parseFloat(String(r["Longitud"]).replace(",", "."));
  return isFinite(la) && isFinite(lo) ? [la, lo] : null;
}
function dist(a, b){ const R = 6371, k = Math.PI / 180, dLa = (b[0]-a[0])*k, dLo = (b[1]-a[1])*k;

function filtered(){
  const q = norm(S.q).trim();
  return data.sitios.filter(r =>
    (!S.cat || r["Tipo"] === S.cat) &&
    (!S.muni || r["Municipio"] === S.muni) &&

    (!S.soloVer || verified(r)) && (!S.soloOf || oficial(r) || verified(r)) && fitsSize(r) &&
    (!q || norm(r["Nombre"] + " " + r["Municipio"] + " " + r["Subtipo"]).includes(q)));

function short(v, n){

const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ---------- Edición (solo editores) ---------- */
function markDirty(){ S.dirty++; const b = $("#saveBtn"); b.disabled = false; b.textContent = `Guardar cambios (${S.dirty})`;
  try { sessionStorage.setItem("tp-draft", JSON.stringify(data)); } catch(e){} }
function editForm(i){
  const r = i === null ? Object.fromEntries(COLS.map(c => [c, ""])) : data.sitios[i];
  if (i === null){ r["Fecha de comprobación"] = new Date().toISOString().slice(0, 10); r["Verificado"] = "No"; r["Fuente oficial"] = "No"; r["Comarca"] = "Bahía de Cádiz"; }
  const input = (c, n) => {
    if (c === "Tipo") return `<label for="e${n}">${c}<select id="e${n}" data-col="${esc(c)}">${CATS.map(k => `<option ${k[0] === r[c] ? "selected" : ""}>${esc(k[0])}</option>`).join("")}</select></label>`;
    if (c === "Fuente oficial") return `<label for="e${n}">${c}<select id="e${n}" data-col="${esc(c)}"><option ${oficial(r) ? "" : "selected"}>No</option><option ${oficial(r) ? "selected" : ""}>Sí</option></select></label>`;
    if (c === "Verificado") return `<label for="e${n}">${c}<select id="e${n}" data-col="${esc(c)}"><option ${verified(r) ? "" : "selected"}>No</option><option ${verified(r) ? "selected" : ""}>Sí</option></select></label>`;
    if (c === "Fecha de comprobación") return `<label for="e${n}">${c}<input type="date" id="e${n}" data-col="${esc(c)}" value="${esc(r[c])}"></label>`;
    const long = ["Otras condiciones","Zonas permitidas","Fuente","Dirección"].includes(c);
    return `<label for="e${n}">${c}${long ? `<textarea id="e${n}" data-col="${esc(c)}" rows="3">${esc(r[c])}</textarea>` : `<input id="e${n}" data-col="${esc(c)}" value="${esc(r[c])}">`}</label>`;
  };
  openSheet(`${closeBtn}<h2 id="sheetTitle">${i === null ? "Añadir sitio" : "Editar ficha"}</h2>
    <p class="note">Si no sabes un dato, escribe "No consta". No olvides la fuente.</p>
    <div class="form" id="eform">${COLS.map(input).join("")}
    <div class="actions"><button class="btn pri" type="button" id="eSave" data-i="${i === null ? "" : i}">Aplicar</button>
    ${i === null ? "" : `<button class="btn" type="button" id="eDel" data-i="${i}">Eliminar sitio</button>`}</div>
    <p class="note" id="eMsg"></p></div>`);
}
function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ","){ row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}
function importCSV(text){
  const rows = parseCSV(text); if (rows.length < 2) return "El archivo no tiene filas de datos.";
  const head = rows[0].map(h => h.trim());
  const idx = c => head.findIndex(h => norm(h) === norm(c));
  const missing = ["Nombre","Tipo","Municipio"].filter(c => idx(c) < 0);
  if (missing.length) return "Faltan columnas: " + missing.join(", ") + ". Usa las mismas columnas que la plantilla.";
  let added = 0, changed = 0;
  const pos = new Map(data.sitios.map((r, i) => [key(r), i]));
  rows.slice(1).forEach(cells => {
    const r = Object.fromEntries(COLS.map(c => { const j = idx(c); return [c, j >= 0 ? (cells[j] || "").trim() : (c === "Verificado" || c === "Fuente oficial" ? "No" : "No consta")]; }));
    if (!r["Nombre"]) return;
    const k = key(r);
    if (pos.has(k)){ data.sitios[pos.get(k)] = r; changed++; } else { pos.set(k, data.sitios.length); data.sitios.push(r); added++; }
  });
  markDirty(); update();
  return `Importado: ${added} sitios nuevos y ${changed} actualizados. Pulsa "Guardar cambios" para publicarlo.`;
}
function importReviews(text){
  const rows = parseCSV(text); if (rows.length < 2) return "El archivo no tiene filas de datos.";
  const head = rows[0].map(h => norm(h).trim());
  const col = (...names) => head.findIndex(h => names.some(n => h === norm(n) || h.startsWith(norm(n))));
  const c = {sitio: col("Sitio que visitaste", "Sitio"), muni: col("Municipio"), est: col("Valoración general", "Valoracion"), ent: col("¿Te dejaron entrar con tu perro?"),
    tam: col("Tamaño de tu perro"), txt: col("Tu reseña"), fec: col("Fecha aproximada de la visita"), nom: col("Nombre o apodo que se mostrará", "Nombre o apodo"),
    ap: col("Aprobada"), id: col("Submission ID", "ID de respuesta", "Response ID")};
  if (c.sitio < 0 || c.muni < 0 || c.txt < 0) return "No encuentro las columnas del formulario de reseñas (Sitio, Municipio, Tu reseña).";
  if (c.ap < 0) return 'Añade una columna "Aprobada" y escribe "Sí" en las reseñas que quieras publicar.';
  data.resenas = data.resenas || [];
  const seen = new Set(data.resenas.map(x => x.id).filter(Boolean));
  let added = 0, skipped = 0; const missing = [], clash = [];
  rows.slice(1).forEach(cells => {
    const g = i => i >= 0 ? (cells[i] || "").trim() : "";
    if (!norm(g(c.ap)).startsWith("si")) return;
    const k = key({"Nombre": g(c.sitio), "Municipio": g(c.muni)});
    const i = KI.get(k);
    if (i === undefined){ missing.push(g(c.sitio) + " (" + g(c.muni) + ")"); return; }
    const id = g(c.id) || (k + "|" + g(c.nom) + "|" + g(c.fec) + "|" + g(c.txt).slice(0, 40));
    if (seen.has(id)){ skipped++; return; }
    seen.add(id);
    const rv = {id, k, nombre: g(c.nom).slice(0, 40), estrellas: Math.max(0, Math.min(5, parseInt(g(c.est), 10) || 0)), entrar: g(c.ent), tamano: g(c.tam), texto: g(c.txt).slice(0, 1500), fecha: g(c.fec)};
    data.resenas.push(rv); added++;
    const adm = norm(data.sitios[i]["Admite perros (Sí/No/Con condiciones)"]).trim();
    if (norm(rv.entrar) === "no" && adm !== "no") clash.push(data.sitios[i]["Nombre"]);
  });
  markDirty(); update();
  let msg = `Añadidas ${added} reseñas.` + (skipped ? ` ${skipped} ya estaban.` : "");
  if (missing.length) msg += ` No encuentro estos sitios en la app: ${missing.slice(0, 5).join("; ")}${missing.length > 5 ? "…" : ""}.`;
  if (clash.length) msg += ` Revisa estas fichas: alguien dice que no le dejaron entrar con su perro: ${[...new Set(clash)].join("; ")}.`;
  return msg + ' Pulsa "Guardar cambios" para publicarlas.';
}
function toCSV(){
  const q = v => /[",\n;]/.test(v ?? "") ? '"' + String(v).replace(/"/g, '""') + '"' : (v ?? "");
  return "﻿" + [COLS.join(","), ...data.sitios.map(r => COLS.map(c => q(r[c])).join(","))].join("\n");
}
async function save(){
  if (!artifactNS) return;
  const b = $("#saveBtn"); b.disabled = true; b.textContent = "Guardando…";
  try {
    await artifactNS.publish({"datos.json": {content: JSON.stringify(data), contentType: "application/json"}});
    S.dirty = 0; b.textContent = "Guardar cambios"; try { sessionStorage.removeItem("tp-draft"); } catch(e){}
    toast("Cambios publicados. Ya los ve todo el mundo.");
  } catch (e){
    const code = e && e.code;
    if (code === "conflict") toast("Otra persona guardó antes. La página se recargará con su versión.");
    else if (code === "not_writer" || code === "not_granted"){ toast("Esta cuenta solo puede ver la app, no editarla."); S.canEdit = false; exitEdit(); }
    else { toast("No se pudo guardar. Inténtalo de nuevo en un momento."); b.disabled = false; b.textContent = `Guardar cambios (${S.dirty})`; }
  }
}
function enterEdit(){ S.edit = true; $("#editbar").hidden = false; }
function exitEdit(){ S.edit = false; $("#editbar").hidden = true; }

/* ---------- Eventos ---------- */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button, a"); if (!t) { if (ev.target.id === "scrim") closeSheet(); return; }
  if (t.dataset.close !== undefined) return closeSheet();
  if (t.dataset.cat !== undefined){ S.cat = t.dataset.cat; S.sub = ""; return update(); }
  if (t.dataset.near){ const m = t.dataset.near; S.me = null; setHere(center(m), m, m); $("#list").scrollTop = 0; return; }
  if (t.dataset.homecat !== undefined){ S.cat = t.dataset.homecat; S.sub = ""; setView("list"); update(); $("#list").scrollTop = 0; return; }
  if (t.dataset.clear){ const k = t.dataset.clear; if (k === "soloVer" || k === "soloOf") S[k] = false; else S[k] = k === "here" ? null : ""; return update(); }
  if (t.dataset.i !== undefined && t.classList.contains("item")) return openFicha(+t.dataset.i);
  if (t.dataset.trip !== undefined && t.dataset.ti !== undefined) return setTrip(+t.dataset.ti, t.dataset.trip);
  if (t.dataset.soon) return soon(t.dataset.soon);
  if (t.dataset.edit !== undefined) return editForm(+t.dataset.edit);
  if (t.dataset.verify !== undefined){ const r = data.sitios[+t.dataset.verify]; r["Verificado"] = "Sí"; r["Fecha de comprobación"] = new Date().toISOString().slice(0, 10); markDirty(); update(); return openFicha(+t.dataset.verify); }
  switch (t.id){
    case "vHome": return setView("home");
    case "homeMap": return setView("map");
    case "homeNear": return nearMe();
    case "vMap": return setView("map");
    case "vList": return setView("list");
    case "vTrip": return setView("trip");
    case "tripExplore": return setView("list");
    case "filtersBtn": return openFilters();
    case "fApply": S.muni = $("#fMuni").value; S.comarca = $("#fCom").value; S.sub = $("#fSub").value; S.size = $("#fSize").value; S.soloVer = $("#fVer").checked; S.soloOf = $("#fOf").checked; closeSheet(); return update();
    case "fReset": Object.assign(S, {muni: "", comarca: "", sub: "", size: "", soloVer: false, soloOf: false, cat: "", here: null}); closeSheet(); return update();
    case "nearBtn": return nearMe();
    case "geoBtn": {
      const msg = $("#geoMsg");
      if (!navigator.geolocation){ msg.textContent = "Este navegador no comparte la ubicación. Elige tu municipio en la lista."; return; }
      msg.textContent = "Buscando tu ubicación…";
      navigator.geolocation.getCurrentPosition(p => { S.me = {p: [p.coords.latitude, p.coords.longitude], acc: p.coords.accuracy}; setHere(S.me.p, "tu ubicación", ""); },
        () => { msg.textContent = "Aquí no se puede usar la ubicación del móvil. Elige tu pueblo arriba."; }, {timeout: 6000, maximumAge: 600000});
      return;
    }
    case "suggestBtn": return openForm("suggest");
    case "joinBtn": return openForm("join");
    case "saveBtn": return save();
    case "addBtn": return editForm(null);
    case "exitEdit": return exitEdit();
    case "enterEdit": closeSheet(); return enterEdit();
    case "importBtn": return openSheet(`${closeBtn}<h2 id="sheetTitle">Importar CSV</h2>
      <p>Sube el CSV de una comarca nueva o una versión corregida. Los sitios con el mismo nombre y municipio se actualizan; el resto se añaden.</p>
      <div class="form"><label for="iFile">Archivo CSV<input type="file" id="iFile" accept=".csv,text/csv"></label>
      <label for="iText">O pega aquí el contenido<textarea id="iText" placeholder="Nombre,Tipo,Subtipo,Municipio,…"></textarea></label>
      <div class="actions"><button class="btn pri" type="button" id="iGo">Importar</button></div><p class="note" id="iMsg" role="status"></p></div>`);
    case "revImportBtn": return openSheet(`${closeBtn}<h2 id="sheetTitle">Publicar reseñas</h2>
      <p>Descarga las respuestas del formulario de reseñas en CSV, añade una columna <strong>Aprobada</strong> y escribe <strong>Sí</strong> en las que quieras publicar. Luego súbelo aquí.</p>
      <p class="note">El email de quien escribe la reseña nunca se publica. Las reseñas repetidas se ignoran.</p>
      <div class="form"><label for="rFile">Archivo CSV<input type="file" id="rFile" accept=".csv,text/csv"></label>
      <label for="rText">O pega aquí el contenido<textarea id="rText"></textarea></label>
      <div class="actions"><button class="btn pri" type="button" id="rGo">Importar reseñas</button></div><p class="note" id="rMsg" role="status"></p>
      <p class="note">Hay ${(data.resenas || []).length} reseñas publicadas.</p></div>`);
    case "rGo": {
      const f = $("#rFile").files[0]; const txt = f ? await f.text() : $("#rText").value;
      $("#rMsg").textContent = txt.trim() ? importReviews(txt) : "Elige un archivo o pega el contenido.";
      return;
    }
    case "iGo": {
      const f = $("#iFile").files[0]; const txt = f ? await f.text() : $("#iText").value;
      $("#iMsg").textContent = txt.trim() ? importCSV(txt) : "Elige un archivo o pega el contenido.";
      return;
    }
    case "exportBtn": {
      if (!downloadsNS){ toast("La descarga no está disponible en esta vista."); return; }
      try { await downloadsNS.save({filename: "TravelPet_datos.csv", data: new Blob([toCSV()], {type: "text/csv"})}); } catch(e){ toast("Descarga cancelada."); }
      return;
    }
    case "settingsBtn": return openSheet(`${closeBtn}<h2 id="sheetTitle">Formularios</h2>
      <p>Pega el enlace de cada formulario (Tally o Google Forms). Las respuestas se guardan en tu cuenta del formulario.</p>
      <div class="form">
      <label for="sErr">¿Este dato está mal?<input id="sErr" type="url" value="${esc(data.config.formErrorUrl || "")}" placeholder="https://tally.so/r/…"></label>
      <label for="sSug">Sugerir un sitio<input id="sSug" type="url" value="${esc(data.config.formSuggestUrl || "")}" placeholder="https://tally.so/r/…"></label>
      <label for="sJoin">Apúntate (email)<input id="sJoin" type="url" value="${esc(data.config.formJoinUrl || "")}" placeholder="https://tally.so/r/…"></label>
      <label for="sRev">Dejar reseña<input id="sRev" type="url" value="${esc(data.config.formReviewUrl || "")}" placeholder="https://tally.so/r/…"></label>
      <div class="actions"><button class="btn pri" type="button" id="sGo">Aplicar</button></div></div>`);
    case "sGo": data.config.formErrorUrl = $("#sErr").value.trim(); data.config.formSuggestUrl = $("#sSug").value.trim(); data.config.formJoinUrl = $("#sJoin").value.trim(); data.config.formReviewUrl = $("#sRev").value.trim(); markDirty(); closeSheet(); toast('Pulsa "Guardar cambios" para publicarlo.'); return;
    case "eSave": {
      const r = {}; document.querySelectorAll("#eform [data-col]").forEach(el => r[el.dataset.col] = el.value.trim() || (["Latitud","Longitud"].includes(el.dataset.col) ? "" : "No consta"));
      if (isNC(r["Nombre"]) || isNC(r["Municipio"])){ $("#eMsg").textContent = "El nombre y el municipio son obligatorios."; return; }
      const i = t.dataset.i; if (i === "") data.sitios.push(r); else data.sitios[+i] = r;
      markDirty(); update(); closeSheet(); toast('Ficha guardada en borrador. Pulsa "Guardar cambios" para publicarla.'); return;
    }
    case "eDel": {
      if (t.dataset.confirm !== "1"){ t.dataset.confirm = "1"; t.textContent = "Pulsa otra vez para eliminar"; return; }
      data.sitios.splice(+t.dataset.i, 1); markDirty(); update(); closeSheet(); toast("Sitio eliminado del borrador."); return;
    }
  }
});
document.addEventListener("change", ev => { if (ev.target.id === "nMuni" && ev.target.value){ const m = ev.target.value; setHere(center(m), m, m); } });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
$("#q").addEventListener("input", ev => { S.q = ev.target.value; if (S.view === "map" && S.q.trim()) setView("list"); renderList(); renderMap(); });

/* ---------- Arranque ---------- */
async function boot(){
  try { data = JSON.parse($("#seed").textContent); } catch(e){}
  try { const r = await fetch("datos.json", {cache: "no-store"}); if (r.ok) data = await r.json(); } catch(e){}
  data.config = data.config || {}; data.sitios = data.sitios || []; data.resenas = data.resenas || [];
  trip = loadLocalTrip();
  initMap(); setView(S.view); update();
  if (window.claude && window.claude.use){
    (async () => {
      try {
        const [user, art, dl, db] = await Promise.all([claude.use("user"), claude.use("artifact"), claude.use("downloads"), claude.use("db")]);
        artifactNS = art; downloadsNS = dl;
        if (user && db){
          try {
            const uid = await user.id();
            if (uid){
              const ref = db.doc("data/users/" + uid + "/viaje");
              const snap = await ref.get();
              const remote = snap.exists ? tripFromArr((snap.data() || {}).items) : {};
              let addLocal = false;
              if (lsGet(TRIP_SYNCED) !== uid){ for (const [k, v] of Object.entries(trip)) if (!remote[k]){ remote[k] = v; addLocal = true; } }
              trip = remote; tripRef = ref; tripLive = true;
              lsSet(TRIP_SYNCED, uid); lsSet(TRIP_LS, JSON.stringify(tripToArr()));
              if (addLocal) flushTrip();
              renderTripAll(); renderList();
            }
          } catch(e){ tripRef = null; tripLive = false; }
        }
        if (user && art && await user.canEdit()){
          S.canEdit = true;
          try { const d = sessionStorage.getItem("tp-draft"); if (d){ data = JSON.parse(d); update(); S.dirty = 1; const sb = $("#saveBtn"); sb.disabled = false; sb.textContent = "Guardar cambios (borrador)"; enterEdit(); } } catch(e){}
          const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.id = "enterEdit"; b.textContent = "Editar datos";
          $(".fab").prepend(b);
        }
      } catch(e){}
    })();
  }
}
boot();
})();
</script>
